name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-headers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check source file license headers
        run: python3 scripts/check-license-headers.py

  build-and-test:
    runs-on: ubuntu-24.04
    # A cold LLVM cache can take nearly two hours before the project build starts.
    timeout-minutes: 180

    env:
      # MLIR trait TypeIDs use compiler-dependent type names. The hidden C API
      # must use the same toolchain as the shared LLVM/MLIR dependency.
      CC: clang-18
      CXX: clang++-18
      LLVM_VERSION: 22.1.8
      LLVM_SOURCE: ${{ github.workspace }}/llvm-project
      LLVM_BUILD: ${{ github.workspace }}/llvm-build

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build libgtest-dev qemu-user gcc-aarch64-linux-gnu

      - name: Download LLVM source
        run: |
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/llvm-project-${LLVM_VERSION}.src.tar.xz"
          echo "Downloading $URL"
          curl -fsSL -o llvm.tar.xz "$URL"
          mkdir -p $LLVM_SOURCE
          tar xf llvm.tar.xz -C $LLVM_SOURCE --strip-components=1
          rm llvm.tar.xz

      - name: Restore LLVM build cache
        id: cache-llvm-build
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LLVM_BUILD }}
          key: llvm-build-${{ env.LLVM_VERSION }}-shared-clang18-v1

      - name: Build LLVM
        if: steps.cache-llvm-build.outputs.cache-hit != 'true'
        run: |
          mkdir -p $LLVM_BUILD && cd $LLVM_BUILD
          cmake $LLVM_SOURCE/llvm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=mlir \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DLLVM_DYLIB_COMPONENTS=all \
            -DMLIR_LINK_MLIR_DYLIB=ON \
            -DLLVM_BUILD_UTILS=ON \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DMLIR_INCLUDE_TESTS=OFF \
            -DMLIR_ENABLE_BINDINGS_PYTHON=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF
          ninja

      - name: Save LLVM build cache
        if: steps.cache-llvm-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LLVM_BUILD }}
          key: ${{ steps.cache-llvm-build.outputs.cache-primary-key }}

      - name: Configure project
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DLLVM_PROJECT_BUILD_DIR=$LLVM_BUILD \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLK_BUILD_TOOLS=ON \
            -DLLK_BUILD_E2E_TESTS=ON \
            -DLLK_BUILD_PYTHON_CAPI=ON \
            -DLLK_BUILD_ARM_EVIDENCE=ON

      - name: Build
        run: cd build && ninja

      - name: Run Arm SVE emulated evidence
        run: |
          cd build
          set -o pipefail
          ctest -R '^ArmSVEExecutionEvidence$' --no-tests=error --output-on-failure 2>&1 | tee arm-sve-evidence.log

      - name: Run Arm SME emulated evidence
        run: |
          cd build
          set -o pipefail
          ctest -R '^ArmSMEExecutionEvidence$' --no-tests=error --output-on-failure 2>&1 | tee arm-sme-evidence.log

      - name: Run selected AVX2 acceptance
        run: |
          export LLK_ACCEPTANCE_ARTIFACT_DIR="$GITHUB_WORKSPACE/build/selected-execution-evidence"
          uname -a | tee build/selected-avx2-host.txt
          lscpu | grep -E 'Architecture|Model name|Flags' | head -n 3 | tee -a build/selected-avx2-host.txt
          cmake -LA -N build | grep -E '^CMAKE_(C|CXX)_COMPILER:FILEPATH=' | tee -a build/selected-avx2-host.txt
          "$LLVM_BUILD/bin/llvm-config" --version | tee -a build/selected-avx2-host.txt
          cd build
          set -o pipefail
          ./MappedAcceptance --require-selected-target \
            --gtest_filter=MappedAcceptance.* \
            --gtest_output=xml:selected-avx2-results.xml 2>&1 | tee selected-avx2.log
          ./DynamicMappedAcceptance --require-selected-target \
            --gtest_filter=DynamicMapped*.* \
            --gtest_output=xml:selected-avx2-dynamic-results.xml 2>&1 | tee selected-avx2-dynamic.log
          python3 ../test/Execution/check_selected_execution_evidence.py selected-execution-evidence

      - name: Run tests
        run: |
          cd build
          set -o pipefail
          ctest --verbose --output-on-failure --output-junit ctest-results.xml 2>&1 | tee ctest-output.log
          python3 ../test/Execution/check_required_execution.py ctest-results.xml

      - name: Save selected execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-avx2-execution-evidence
          path: |
            build/ctest-results.xml
            build/ctest-output.log
            build/selected-avx2-results.xml
            build/selected-avx2.log
            build/selected-avx2-dynamic-results.xml
            build/selected-avx2-dynamic.log
            build/selected-avx2-host.txt
            build/test/SelectedVectorWidth/selected-width-*.mlir
            build/test/SelectedVectorWidth/selected-fused.mlir
            build/selected-execution-evidence/*
            build/prediction-validation-evidence/
            build/arm-sve-evidence.log
            build/test/ArmSVEExecutionEvidence/
            build/arm-sme-evidence.log
            build/test/ArmSMEExecutionEvidence/

  # Required Python frontend lanes. Each job builds only the C ABI the package
  # loads and runs the pytest markers declared in
  # test/Frontend/acceptance_manifest.json. The final frontend-acceptance job
  # rejects zero execution, skipped or failed lanes, absent native-call
  # counters and reference results substituted for selected-target execution.
  python-frontend:
    name: Python frontend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      LLVM_VERSION: 22.1.8
      LLVM_BUILD: ${{ github.workspace }}/llvm-build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build g++ libomp-18-dev

      # The cache key matches build-and-test. A cache miss means the pinned
      # LLVM/MLIR build is unavailable and this job must fail rather than fall
      # back to an ambient LLVM.
      - name: Download LLVM source
        run: |
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/llvm-project-${LLVM_VERSION}.src.tar.xz"
          curl -fsSL -o llvm.tar.xz "$URL"
          mkdir -p ${{ github.workspace }}/llvm-project
          tar xf llvm.tar.xz -C ${{ github.workspace }}/llvm-project --strip-components=1
          rm llvm.tar.xz

      - name: Restore LLVM build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LLVM_BUILD }}
          key: llvm-build-${{ env.LLVM_VERSION }}-shared-clang18-v1

      - name: Install the package, test tools and Torch 2.9.0 (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.9.0"
          python -m pip install "./python[test]"
          python -c "import torch; assert torch.__version__.split('+')[0] == '2.9.0', torch.__version__"

      - name: Build the frontend C ABI
        run: |
          # clang-18 must match the LLVM/MLIR build for the C ABI's type IDs.
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DLLVM_PROJECT_BUILD_DIR=$LLVM_BUILD \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DLLK_BUILD_TOOLS=OFF \
            -DBUILD_TESTING=OFF \
            -DLLK_BUILD_PYTHON_CAPI=ON
          ninja -C build LLKFrontendCAPI

      - name: Run the required Python 3.11/3.12 lanes
        run: |
          set -euo pipefail
          # Inductor emits C++ for the host compiler. The setup-python
          # library path carries an older libstdc++ than the system GCC 14,
          # which lacks symbols the generated extension references.
          unset LD_LIBRARY_PATH
          export LLK_FRONTEND_LIBRARY="$PWD/build/lib/libLLKFrontendCAPI.so"
          export LLK_PYTHON_EVIDENCE_DIR="$PWD/frontend-evidence"
          mkdir -p "$LLK_PYTHON_EVIDENCE_DIR/junit"
          run_lane() {
            local lane="$1" expression="$2"
            LLK_PYTHON_LANE="$lane" python -m pytest test/python \
              -m "$expression" -q \
              --junitxml="$LLK_PYTHON_EVIDENCE_DIR/junit/$lane.xml"
          }
          run_lane frontend_unit \
            "frontend_unit and not frontend_native and not torch_integration and not triton_integration"
          run_lane frontend_native \
            "frontend_native and not torch_integration and not triton_integration"
          run_lane torch_integration "torch_integration"

      - name: Upload lane evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence-core
          path: |
            frontend-evidence/junit/*.xml
            frontend-evidence/*.json

  python-minimal:
    name: Python frontend without optional dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      CC: clang-18
      CXX: clang++-18
      LLVM_VERSION: 22.1.8
      LLVM_BUILD: ${{ github.workspace }}/llvm-build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build

      - name: Download LLVM source
        run: |
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/llvm-project-${LLVM_VERSION}.src.tar.xz"
          curl -fsSL -o llvm.tar.xz "$URL"
          mkdir -p ${{ github.workspace }}/llvm-project
          tar xf llvm.tar.xz -C ${{ github.workspace }}/llvm-project --strip-components=1
          rm llvm.tar.xz

      - name: Restore LLVM build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LLVM_BUILD }}
          key: llvm-build-${{ env.LLVM_VERSION }}-shared-clang18-v1

      - name: Install the package without Torch or Triton
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./python[test]"
          python -c "import importlib.util; assert importlib.util.find_spec('torch') is None; assert importlib.util.find_spec('triton') is None"

      - name: Build the frontend C ABI
        run: |
          cmake -S . -B build -G Ninja \
            -DLLVM_PROJECT_BUILD_DIR=$LLVM_BUILD \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLK_BUILD_TOOLS=OFF \
            -DBUILD_TESTING=OFF \
            -DLLK_BUILD_PYTHON_CAPI=ON
          ninja -C build LLKFrontendCAPI

      - name: Run the compiler-free lane
        run: |
          set -euo pipefail
          export LLK_FRONTEND_LIBRARY="$PWD/build/lib/libLLKFrontendCAPI.so"
          export LLK_PYTHON_EVIDENCE_DIR="$PWD/frontend-evidence"
          mkdir -p "$LLK_PYTHON_EVIDENCE_DIR/junit"
          LLK_PYTHON_LANE=frontend_unit python -m pytest test/python \
            -m "frontend_unit and not frontend_native and not torch_integration and not triton_integration" \
            -q --junitxml="$LLK_PYTHON_EVIDENCE_DIR/junit/frontend_unit.xml"

  triton-frontend:
    name: Python frontend (pinned Triton and selected AVX2)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      LLVM_VERSION: 22.1.8
      LLVM_BUILD: ${{ github.workspace }}/llvm-build
      TRITON_REVISION: 93f05e19a8024938c320d82854e307d602b5a05d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build cmake g++ zlib1g-dev libomp-18-dev

      - name: Download LLVM source
        run: |
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/llvm-project-${LLVM_VERSION}.src.tar.xz"
          curl -fsSL -o llvm.tar.xz "$URL"
          mkdir -p ${{ github.workspace }}/llvm-project
          tar xf llvm.tar.xz -C ${{ github.workspace }}/llvm-project --strip-components=1
          rm llvm.tar.xz

      - name: Restore LLVM build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LLVM_BUILD }}
          key: llvm-build-${{ env.LLVM_VERSION }}-shared-clang18-v1

      - name: Install the package and Torch 2.9.0 (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.9.0"
          python -m pip install "./python[test]"
          python -c "import torch; assert torch.__version__.split('+')[0] == '2.9.0', torch.__version__"

      - name: Build the frontend C ABI
        run: |
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DLLVM_PROJECT_BUILD_DIR=$LLVM_BUILD \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DLLK_BUILD_TOOLS=OFF \
            -DBUILD_TESTING=OFF \
            -DLLK_BUILD_PYTHON_CAPI=ON
          ninja -C build LLKFrontendCAPI

      - name: Check out and build the pinned upstream Triton
        run: |
          # Keep the checkout outside the workspace: a top-level `triton/`
          # directory would shadow the installed package during pytest
          # collection and provide no `triton.language`.
          TRITON_DIR="${{ runner.temp }}/triton"
          git init "$TRITON_DIR"
          git -C "$TRITON_DIR" remote add origin https://github.com/triton-lang/triton.git
          git -C "$TRITON_DIR" fetch --depth 1 origin "$TRITON_REVISION"
          git -C "$TRITON_DIR" checkout --detach FETCH_HEAD
          python -m pip install -e "$TRITON_DIR"

      - name: Verify AVX2 is available
        run: grep -qm1 avx2 /proc/cpuinfo

      - name: Run the upstream Triton and selected AVX2 lanes
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          export LLK_FRONTEND_LIBRARY="$PWD/build/lib/libLLKFrontendCAPI.so"
          export LLK_TRITON_PYTHONPATH="${{ runner.temp }}/triton/python"
          export LLK_PYTHON_EVIDENCE_DIR="$PWD/frontend-evidence"
          mkdir -p "$LLK_PYTHON_EVIDENCE_DIR/junit"
          run_lane() {
            local lane="$1" expression="$2"
            LLK_PYTHON_LANE="$lane" python -m pytest test/python \
              -m "$expression" -q \
              --junitxml="$LLK_PYTHON_EVIDENCE_DIR/junit/$lane.xml"
          }
          run_lane triton_integration "triton_integration"
          run_lane selected_avx2 "selected_avx2"

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence-triton
          path: |
            frontend-evidence/junit/*.xml
            frontend-evidence/*.json

  frontend-acceptance:
    name: Python frontend acceptance
    needs: [python-frontend, python-minimal, triton-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect lane evidence
        uses: actions/download-artifact@v4
        with:
          pattern: frontend-evidence-*
          path: frontend-evidence
          merge-multiple: true

      - name: Enforce required execution
        run: |
          python test/python/check_required_python_execution.py \
            --manifest test/Frontend/acceptance_manifest.json \
            --junit-dir frontend-evidence/junit \
            --evidence-dir frontend-evidence \
            --json frontend-evidence/acceptance.json

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-acceptance-evidence
          path: frontend-evidence/
