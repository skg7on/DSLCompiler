name: Developer manual

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/manual/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/manual/requirements.txt
      - name: Test documentation checker
        run: python -m unittest discover -s test/Docs -p 'test_*.py'
      - name: Test incremental source links
        run: python -m unittest discover -s docs/manual/source/_ext/tests -p 'test_*.py'
      - name: Build HTML with strict reference checks
        run: python -m sphinx -b html -n -W --keep-going -d build/docs/doctrees docs/manual/source build/docs/html
      - name: Check committed HTML is current
        run: diff -r -x .buildinfo docs/manual/html build/docs/html
      - uses: actions/upload-artifact@v4
        with:
          name: developer-manual
          path: build/docs/html/
          if-no-files-found: error
