<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 940" role="img" aria-labelledby="title desc">
<title id="title">MicroIR compiler architecture</title>
<desc id="desc">LLK semantic source feeds either the established CPU pipeline or the MicroIR exporter. Concrete MicroIR is mapped using machine facts and target policy, then analyzed or lowered through a portable reference bridge. Search IR currently feeds synthetic candidate analysis.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54738a"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#19384d;font-size:20px} .title{font-weight:650;font-size:22px}.small{font-size:17px;fill:#4b6475}.edge{fill:none;stroke:#54738a;stroke-width:2.5;marker-end:url(#arrow)}.node{fill:#fff;stroke:#769ab4;stroke-width:1.5;rx:10}</style>
