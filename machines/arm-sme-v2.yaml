# Machine model (v2): Arm SME, the matrix-capable half of the Arm target pair.
#
# It shares the vector facts of arm-sve-v2.yaml and adds streaming matrix
# storage. Both profiles choose 512 bits; streaming SVL and non-streaming VL
# are independent architectural facts, so the equality is an experimental
# control, not one length derived from the other.
#
# At SVL=512 the ZA array holds (SVL/8) x (SVL/8) = 4096 bytes. ZA.S has four
# logical 16x16 f32 tiles with interleaved slices, not four physical memory
# banks, and arranging them as one 32x32 accumulator is a software choice. The
# declared `banks: 4` is therefore an independent modeling seed that happens to
# match the logical tile count, never a derivation from it.
#
# Every number here is a modeling seed. In particular a modeled 16x16x16
# fragment is a macro-work unit, not one FMOPA instruction, and the 4096-byte
# capacity is an architectural fact while the bandwidth, latency, concurrency
# and throughput are chosen inputs.

schema: llk.machine.v2
target: arm-sme
description: >-
  Arm SME profile at a chosen SVL of 512 bits: eight workers in one cluster,
  each with a 512-bit vector engine and a modeled 16x16x16 streaming matrix
  engine accumulating into a 4096-byte ZA array, behind a shared
  DRAM/L2/SRAM hierarchy, with one DMA engine.

clock_hz: 3000000000
worker_threads: 8
sync:
  barrier_cycles: 100
  wait_cycles: 0

executors:
  # `cluster`, `sve_engine` and `za_engine` are this profile's own labels; their
  # `refines` entries are what let a kernel written for the abstract `group`,
  # `vector` or `matrix` owner resolve here.
  - id: cluster.0
    kind: cluster
    refines: [group]
    concurrency: 1
  - id: worker.0
    kind: worker
    parent: cluster.0
    concurrency: 8
  - id: sve_eng.0
    kind: sve_engine
    refines: [vector]
    parent: worker.0
    concurrency: 8
  - id: za_eng.0
    kind: za_engine
    refines: [matrix]
    parent: worker.0
    concurrency: 8

memories:
  - id: dram.0
    kind: dram
    visible_from: cluster.0
    capacity_bytes: 68719476736
    alignment_bytes: 64
    supported_layouts: [row_major]
    bandwidth_bytes_per_cycle: 32
    latency_cycles: 220
  - id: l2.0
    kind: l2
    visible_from: cluster.0
    capacity_bytes: 1048576
    alignment_bytes: 64
    supported_layouts: [row_major, vectorized]
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 12
  - id: sram.0
    kind: sram
    visible_from: worker.0
    capacity_bytes: 65536
    alignment_bytes: 64
    supported_layouts: [row_major, vectorized, blocked]
    banks: 1
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 4
  - id: za.0
    kind: acc
    visible_from: worker.0
    # (SVL/8)^2 at SVL=512. Declaring legal direct vector access to physical ZA
    # is not part of this static profile.
    capacity_bytes: 4096
    alignment_bytes: 64
    supported_layouts: [row_major, blocked]
    banks: 4
    bandwidth_bytes_per_cycle: 256
    latency_cycles: 1

compute:
  - id: svp
    kind: vector_engine
    refines: [vector]
    attached_to: worker.0
    element_types: [f32, bf16, i8]
    accumulator_dtypes: [f32]
    supported_layouts: [row_major, vectorized, blocked]
    # 512-bit registers: 16 f32 / 32 bf16 / 64 i8 lanes per vector.
    shapes: [[16], [32], [64]]
    lanes: {f32: 16, bf16: 32, i8: 64}
    issue_cycles: 1
    latency_cycles: 4
    throughput_per_cycle: 32
    concurrency: 8
  - id: za
    kind: matrix_engine
    refines: [matrix]
    attached_to: worker.0
    element_types: [f32, bf16]
    accumulator_dtypes: [f32]
    supported_layouts: [row_major, blocked]
    # A macro-work fragment, not one instruction's shape.
    shapes: [[16, 16, 16]]
    issue_cycles: 1
    latency_cycles: 5
    throughput_per_cycle: 512
    concurrency: 8

transfer_engines:
  - id: dma.0
    kind: dma
    refines: [transfer]
    attached_to: worker.0
    count: 1
    max_outstanding: 8
    setup_cycles: 0

# Every hop moves 64-byte transactions. There is no orphan `rf` link: the ZA
# array is the accumulator storage, and ordinary vector-register allocation is
# not separately modeled.
links:
  - id: dram_to_l2.0
    source: dram.0
    destination: l2.0
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 220
    transaction_bytes: 64
    transfer_engines: [dma.0]
  - id: l2_to_sram.0
    source: l2.0
    destination: sram.0
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 12
    transaction_bytes: 64
    transfer_engines: [dma.0]
  - id: dram_to_sram.0
    source: dram.0
    destination: sram.0
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 220
    transaction_bytes: 64
    transfer_engines: [dma.0]
  - id: sram_to_za.0
    source: sram.0
    destination: za.0
    bandwidth_bytes_per_cycle: 256
    latency_cycles: 4
    transaction_bytes: 64
    transfer_engines: [dma.0]
  - id: za_to_sram.0
    source: za.0
    destination: sram.0
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 4
    transaction_bytes: 64
    transfer_engines: [dma.0]
  - id: sram_to_dram.0
    source: sram.0
    destination: dram.0
    bandwidth_bytes_per_cycle: 32
    latency_cycles: 220
    transaction_bytes: 64
    transfer_engines: [dma.0]
