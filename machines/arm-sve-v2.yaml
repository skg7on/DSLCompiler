# Machine model (v2): Arm SVE, the vector-only half of the Arm target pair.
#
# This profile and arm-sme-v2.yaml both choose 512 bits. Non-streaming VL and
# streaming SVL are independent architectural facts, so the equality is an
# experimental control, not a derivation: neither length is inferred from the
# other, and a different VL needs its own validated profile and policy domain
# rather than one number replaced.
#
# Every number here is a modeling seed, not a measurement or a SKU claim. The
# 2048-byte accumulator budget is 32 Z registers x 64 bytes at VL=512: it is
# the modeled register storage, and a second independent `rf` node would
# double-count it. Operand register allocation, predicate registers and real
# instruction realizability are not established by that budget.
#
# There is deliberately no matrix engine. A vector-only machine has to be able
# to reject a matrix contraction; calling the SVE unit a matrix engine would
# hide exactly the shared-interpreter assumption this pair exists to test.

schema: llk.machine.v2
target: arm-sve
description: >-
  Arm SVE profile at a chosen VL of 512 bits: eight workers in one cluster,
  each with a 512-bit vector engine, behind a shared DRAM/L2/SRAM hierarchy,
  with one DMA engine. No matrix engine and no separate register-file node.

clock_hz: 3000000000
worker_threads: 8
sync:
  barrier_cycles: 100
  wait_cycles: 0

executors:
  # `cluster` and `sve_engine` are this profile's own labels; their `refines`
  # entries are what let a kernel written for the abstract `group` or `vector`
  # owner resolve here without the generic mapping code knowing either word.
  - id: cluster.0
    kind: cluster
    refines: [group]
    concurrency: 1
  - id: worker.0
    kind: worker
    parent: cluster.0
    concurrency: 8
  - id: sve_eng.0
    kind: sve_engine
    refines: [vector]
    parent: worker.0
    concurrency: 8

memories:
  - id: dram.0
    kind: dram
    visible_from: cluster.0
    capacity_bytes: 68719476736
    alignment_bytes: 64
    supported_layouts: [row_major]
    bandwidth_bytes_per_cycle: 32
    latency_cycles: 220
  - id: l2.0
    kind: l2
    visible_from: cluster.0
    capacity_bytes: 1048576
    alignment_bytes: 64
    supported_layouts: [row_major, vectorized]
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 12
  - id: sram.0
    kind: sram
    visible_from: worker.0
    capacity_bytes: 65536
    alignment_bytes: 64
    supported_layouts: [row_major, vectorized, blocked]
    banks: 1
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 4
  - id: acc.0
    kind: acc
    visible_from: worker.0
    # The modeled SVE register budget at VL=512, not a separate hardware array.
    capacity_bytes: 2048
    alignment_bytes: 64
    supported_layouts: [row_major, blocked]
    banks: 32
    bandwidth_bytes_per_cycle: 256
    latency_cycles: 1

compute:
  - id: svp
    kind: vector_engine
    refines: [vector]
    attached_to: worker.0
    element_types: [f32, bf16, i8]
    accumulator_dtypes: [f32]
    supported_layouts: [row_major, vectorized, blocked]
    # 512-bit registers: 16 f32 / 32 bf16 / 64 i8 lanes per vector.
    shapes: [[16], [32], [64]]
    lanes: {f32: 16, bf16: 32, i8: 64}
    issue_cycles: 1
    latency_cycles: 4
    throughput_per_cycle: 32
    concurrency: 8

transfer_engines:
  - id: dma.0
    kind: dma
    refines: [transfer]
    attached_to: worker.0
    count: 1
    max_outstanding: 8
    setup_cycles: 0

# Register movement is modeled abstractly by the SRAM <-> acc hops. Every hop
# moves 64-byte transactions; there is no orphan `rf` link because there is no
# separate register-file node to link to.
links:
  - id: dram_to_l2.0
    source: dram.0
    destination: l2.0
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 220
    transaction_bytes: 64
    transfer_engines: [dma.0]
  - id: l2_to_sram.0
    source: l2.0
    destination: sram.0
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 12
    transaction_bytes: 64
    transfer_engines: [dma.0]
  - id: dram_to_sram.0
    source: dram.0
    destination: sram.0
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 220
    transaction_bytes: 64
    transfer_engines: [dma.0]
  - id: sram_to_acc.0
    source: sram.0
    destination: acc.0
    bandwidth_bytes_per_cycle: 256
    latency_cycles: 4
    transaction_bytes: 64
    transfer_engines: [dma.0]
  - id: acc_to_sram.0
    source: acc.0
    destination: sram.0
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 4
    transaction_bytes: 64
    transfer_engines: [dma.0]
  - id: sram_to_dram.0
    source: sram.0
    destination: dram.0
    bandwidth_bytes_per_cycle: 32
    latency_cycles: 220
    transaction_bytes: 64
    transfer_engines: [dma.0]
