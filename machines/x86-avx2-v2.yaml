# Machine model (v2): Intel x86 CPU with AVX2, the first validation backend.
#
# A faithful v2 translation of the v1 profile: the same numbers, so a cycle
# estimate computed before the migration is still the estimate after it. That
# equivalence is what lets the performance suite keep its baselines.
#
# Three translations are worth knowing:
#
#   * v1 declared owners as kinds with a multiplicity and a parent kind
#     (`worker: 8`, `lane: 8 parent worker`, `vector_engine: 8 parent lane`).
#     v2 executors are concrete nodes, so each kind becomes one node carrying
#     the count as its `concurrency`, chained by the same parent relation.
#   * v1 declared engine classes the same way (`matrix_engines: count 8`). A
#     capability that a schedule *names* must be one node sharing its slots,
#     not eight nodes each with one, so the multiplicity is `concurrency`.
#   * v1 charged a copy from its endpoint memories (the slower endpoint's
#     latency, the destination's bandwidth). v2 puts that cost on the link, so
#     each link below carries exactly what the v1 formula produced.
#
# The numbers are calibration seeds, not claims about any SKU.

schema: llk.machine.v2
target: x86-avx2
description: >-
  Intel AVX2 CPU validation backend. A thread-parallel worker pool with AVX2
  lanes feeding FMA units, behind a shared L1/L2/DRAM hierarchy, with one
  load/store DMA engine.
clock_hz: 3000000000
worker_threads: 8
sync:
  barrier_cycles: 200
  wait_cycles: 0

executors:
  # Each label refines the abstract owner class it denotes: `cluster` is a
  # cooperating group, `lane` and this profile's `worker` are both one worker,
  # and `vector_engine` is the vector engine. `worker` is already the abstract
  # spelling, so it refines nothing. The kernel writes these labels as owner
  # *symbols*; this table is what turns a symbol into a class (design §11.5).
  - id: cluster.0
    kind: cluster
    refines: [group]
    concurrency: 1
  - id: worker.0
    kind: worker
    parent: cluster.0
    concurrency: 8
  - id: lane.0
    kind: lane
    refines: [worker]
    parent: worker.0
    concurrency: 8
  - id: veng.0
    kind: vector_engine
    refines: [vector]
    parent: lane.0
    concurrency: 8

memories:
  - id: dram.0
    kind: dram
    visible_from: cluster.0
    capacity_bytes: 68719476736
    alignment_bytes: 64
    supported_layouts: [row_major]
    bandwidth_bytes_per_cycle: 32
    latency_cycles: 220
  - id: l2.0
    kind: l2
    visible_from: cluster.0
    capacity_bytes: 1048576
    alignment_bytes: 64
    supported_layouts: [row_major, vectorized]
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 12
  - id: sram.0
    kind: sram
    visible_from: cluster.0
    capacity_bytes: 32768
    alignment_bytes: 64
    supported_layouts: [row_major, vectorized, blocked]
    banks: 1
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 4
  - id: acc.0
    kind: acc
    visible_from: cluster.0
    # Two 8x32xf32 accumulators resident at once, one per projection of the
    # fused SwiGLU (each 2x2 spatial owners x 1024 B = 4096 B), is the true
    # live peak a liveness-derived occupancy reports; 4096 holds only a single
    # accumulator and rejected the second projection. The capacity is target
    # policy, so it lives here rather than in the model (issue #129, task R5).
    capacity_bytes: 8192
    alignment_bytes: 64
    supported_layouts: [row_major, vectorized]
    banks: 16
    bandwidth_bytes_per_cycle: 256
    latency_cycles: 1

compute:
  # The vector engine and the FMA unit are attached to the worker scope a
  # placement picks; the lane and vector_engine executors above exist so an
  # abstract owner of that kind, and an owner path through it, still resolve.
  - id: vpu
    kind: vector_engine
    refines: [vector]
    attached_to: worker.0
    element_types: [f32, bf16, i8]
    supported_layouts: [row_major, vectorized]
    shapes: [[8], [16], [32]]
    lanes: {f32: 8, bf16: 16, i8: 32}
    issue_cycles: 1
    latency_cycles: 4
    concurrency: 8
  - id: mxu
    kind: matrix_engine
    refines: [matrix]
    attached_to: worker.0
    element_types: [f32, bf16]
    accumulator_dtypes: [f32]
    supported_layouts: [row_major, vectorized]
    shapes: [[1, 8, 8], [4, 8, 8]]
    issue_cycles: 1
    latency_cycles: 5
    throughput_per_cycle: 16
    concurrency: 8

transfer_engines:
  - id: dma.0
    kind: dma
    refines: [transfer]
    attached_to: worker.0
    count: 1
    max_outstanding: 1
    setup_cycles: 0

# Each link carries what the v1 profile's formula produced for that hop: the
# slower endpoint's latency, and the destination's bandwidth.
links:
  - id: dram_to_l2.0
    source: dram.0
    destination: l2.0
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 220
    transaction_bytes: 64
    transfer_engines: [dma.0]
  - id: l2_to_sram.0
    source: l2.0
    destination: sram.0
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 12
    transaction_bytes: 64
    transfer_engines: [dma.0]
  - id: dram_to_sram.0
    source: dram.0
    destination: sram.0
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 220
    transaction_bytes: 64
    transfer_engines: [dma.0]
  - id: sram_to_acc.0
    source: sram.0
    destination: acc.0
    bandwidth_bytes_per_cycle: 256
    latency_cycles: 4
    transaction_bytes: 64
    transfer_engines: [dma.0]
  - id: acc_to_sram.0
    source: acc.0
    destination: sram.0
    bandwidth_bytes_per_cycle: 64
    latency_cycles: 4
    transaction_bytes: 64
    transfer_engines: [dma.0]
  - id: sram_to_dram.0
    source: sram.0
    destination: dram.0
    bandwidth_bytes_per_cycle: 32
    latency_cycles: 220
    transaction_bytes: 64
    transfer_engines: [dma.0]
